name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE_NAME: resume-screener

jobs:
  docker_build:
    name: Build and push Docker image (Docker Hub)
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKER_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push latest
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$VERSION
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$VERSION

  deploy:
    name: Deploy to server (self-hosted runner)
    runs-on: self-hosted
    needs: docker_build
    steps:
      - name: Deploy latest container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          docker stop resume-screener || true
          docker rm resume-screener || true

          # Run migrations against the shared DB first
          docker run --rm \
            --env-file /opt/resume-screener/.env \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            sh -c "wait-for-db && python manage.py migrate --noinput"

          # Start the server
          docker run -d \
            --name resume-screener \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file /opt/resume-screener/.env \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          sleep 10
          curl -sf http://127.0.0.1:8000/api/health || {
            echo "Health check failed."
            exit 1
          }