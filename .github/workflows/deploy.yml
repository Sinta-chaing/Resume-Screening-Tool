name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend to Linux server
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/resume-screener
            REPO_URL=https://github.com/Sinta-chaing/Resume-Screening-Tool.git

            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$USER":"$USER" "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR/backend"
              python3 -m venv env
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cd "$APP_DIR/backend"
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "WARNING: created .env from .env.example - set real values!"
            fi

            ./env/bin/pip install --upgrade pip
            ./env/bin/pip install -r requirements.txt
            ./env/bin/python manage.py migrate --noinput
            ./env/bin/python manage.py collectstatic --noinput

            if [ -f /etc/systemd/system/resume-screener.service ]; then
              sudo systemctl restart resume-screener
            else
              echo "ERROR: /etc/systemd/system/resume-screener.service not found (see DEPLOYMENT.md section 7)."
              exit 1
            fi

            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
                echo "Health check passed."
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: /api/health not reachable after restart."
            curl -fsS http://127.0.0.1:8000/api/health || true
            exit 1